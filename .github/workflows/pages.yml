name: Pages preview
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          ASTRO_SITE: https://px-poxiao.github.io
          ASTRO_BASE: /blog/
      - name: Check preview output
        run: |
          test -s dist/index.html
          test -s dist/archive/index.html
          if find dist/posts -name index.html -print -quit 2>/dev/null | grep -q .; then
            grep -q 'href="/blog/posts/' dist/archive/index.html
          fi
          test -s dist/pagefind/pagefind.js
          grep -q '/blog/_astro/' dist/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: pages-deployment
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
