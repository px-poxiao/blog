# Include in the public HTTPS server block for blog.px-poxiao.cn.
# Do not proxy the Waline dashboard or user-registration routes publicly.
location = /waline/api/comment {
    limit_except GET POST { deny all; }
    client_max_body_size 16k;
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace, rather than trust, client-supplied forwarded addresses.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://127.0.0.1:8360/api/comment;
}

# Waline likes use a boolean-only update. Strip login credentials so the
# public route cannot execute privileged edits.
location ^~ /waline/api/comment/ {
    if ($uri !~ "^/waline/api/comment/[0-9]{1,20}$") { return 404; }
    limit_except PUT { deny all; }
    client_max_body_size 1k;
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    set $args "lang=zh";
    proxy_pass http://127.0.0.1:8360/api/comment/;
}

location ^~ /waline/ {
    return 404;
}
