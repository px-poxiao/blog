server {
    listen 127.0.0.1:3500 ssl default_server;
    server_name px-poxiao.cn;

    ssl_certificate /www/server/panel/vhost/cert/px-poxiao.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/px-poxiao.cn/privkey.pem;

    root /srv/blog/releases/current;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
